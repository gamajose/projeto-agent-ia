services:
  lab-ssh:
    build:
      context: .
      dockerfile: labs/Dockerfile
    environment:
      LAB_HOST: 0.0.0.0
      LAB_PORT: 2222
      LAB_USER: lab
      LAB_PASSWORD: lab
      LAB_SCENARIO: ${LAB_SCENARIO:-/labs/scenarios/checkmk-systemd-socket.yml}
    ports:
      - "2222:2222"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_ia
      POSTGRES_PASSWORD: agent_ia
      POSTGRES_DB: agent_ia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ia -d agent_ia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
